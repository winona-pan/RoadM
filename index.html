<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的書房">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>我的書房</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* A home library catalogue: one phone-width column, bottom tab bar, bottom-sheet editor. */
:root{
  --bg:#f5f1ea; --surface:#fffdf9; --ink:#29231d; --muted:#766c60; --line:#e6ded2;
  --accent:#2f6b57; --accent-soft:#dcebe4; --warn:#b4532a; --warn-soft:#f8e4d9;
  --unread:#9a8f80; --reading:#c98a1c; --done:#2f6b57; --dropped:#a39a91;
  --shadow:0 1px 2px rgba(41,35,29,.06),0 6px 20px rgba(41,35,29,.06);
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17140f; --surface:#221e18; --ink:#f1ebe2; --muted:#ab9f90; --line:#363027;
  --accent:#6fbf9f; --accent-soft:#1f3a30; --warn:#ec8a5e; --warn-soft:#3d2419;
  --unread:#8f8577; --reading:#e3aa45; --done:#6fbf9f; --dropped:#6f665c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17140f; --surface:#221e18; --ink:#f1ebe2; --muted:#ab9f90; --line:#363027;
  --accent:#6fbf9f; --accent-soft:#1f3a30; --warn:#ec8a5e; --warn-soft:#3d2419;
  --unread:#8f8577; --reading:#e3aa45; --done:#6fbf9f; --dropped:#6f665c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 8px}
.top h1{font:900 28px/1.2 var(--display);margin:0;letter-spacing:.03em}
.add{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:26px;line-height:1;box-shadow:var(--shadow);flex:none}
h2.sec{font:700 17px/1.3 var(--body);margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2.sec small{font-weight:400;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar-in{display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow);width:100%;max-width:400px}
.tab{flex:1;border:0;background:none;border-radius:999px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

/* search */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 10px}
.search-box{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 12px;box-shadow:var(--shadow)}
.search-box input::-webkit-search-cancel-button{display:none}
.search-box input{flex:1;min-width:0;border:0;background:none;padding:8px 0;outline:none;font-size:16px}
.icon-btn{border:0;background:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn.solid{background:var(--accent-soft);color:var(--accent)}
.verdict{border-radius:14px;padding:12px 14px;margin:4px 0 12px;font-weight:500}
.verdict.have{background:var(--warn-soft);color:var(--warn)}
.verdict.free{background:var(--accent-soft);color:var(--accent)}
.verdict .small{font-weight:400;display:block;margin-top:2px}
.verdict button{margin-top:8px}

.stats{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.stat{flex:1;min-width:70px;background:var(--surface);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
.stat b{display:block;font:900 22px/1.1 var(--display)}
.stat span{font-size:12px;color:var(--muted)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px;margin-bottom:8px}
.tools select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;font-size:13.5px}

/* book rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:14px;padding:8px 10px 8px 8px;box-shadow:var(--shadow)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .sub{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmts{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.fmt{font-size:11px;border-radius:5px;padding:0 6px;border:1px solid var(--line);color:var(--muted);line-height:18px}
.fmt.loan{border-color:var(--warn);color:var(--warn)}
.pill{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;color:#fff;background:var(--c)}
.st-unread{--c:var(--unread)} .st-reading{--c:var(--reading)} .st-done{--c:var(--done)} .st-dropped{--c:var(--dropped)}

/* series card */
.series{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.series>.row{box-shadow:none;border-radius:0}
.series .count{font-size:12px;color:var(--muted)}
.vols{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 10px 64px}
.vol{min-width:28px;height:26px;border-radius:6px;font-size:12px;font-weight:700;border:1.5px solid var(--c);background:var(--c);color:#fff;padding:0 5px}
.vol.st-unread{background:transparent;color:var(--c)}
.vol.missing{border-style:dashed;border-color:var(--line);background:transparent;color:var(--muted);cursor:default}
.vol.next{border-style:dashed;border-color:var(--accent);background:transparent;color:var(--accent)}
.series .inner{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px}
.series .inner .row{box-shadow:none;background:var(--bg)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:4px;vertical-align:-1px}
.legend i.o{background:transparent;border:1.5px solid var(--c)}

.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .btn{margin-top:12px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner .acts{display:flex;gap:8px;margin-top:8px}

/* plan page */
.big{font:900 44px/1 var(--display)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.pick{display:flex;gap:14px;align-items:center}
.pick h3{font:900 20px/1.3 var(--display);margin:0 0 2px}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:9px 16px;font-weight:700}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:none;color:var(--warn);padding-inline:4px}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.btn,.icon-btn{white-space:nowrap;flex:none}
.search-row{display:flex;gap:6px;align-items:stretch}.search-row input{flex:1;min-width:0}.search-row .icon-btn{height:auto;min-height:42px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.line-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.line-item:first-child{border-top:0}
.line-item .meta b{font-size:14.5px}
.nudge{font-size:14px;margin-top:6px}

/* settings */
.set{display:flex;flex-direction:column;gap:2px}
.set .line-item{justify-content:space-between}
.set input[type=number]{width:72px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;text-align:right}

/* sheet */
dialog.sheet{border:0;padding:0;width:100%;max-width:640px;max-height:92dvh;margin:auto auto 0;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:22px}}
dialog::backdrop{background:rgba(20,16,12,.45)}
.sheet form{padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-head h3{font:900 20px/1.3 var(--display);margin:0}
.field{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.field>span,.field>label>span{font-size:13px;color:var(--muted);font-weight:500}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .field{margin:6px 0}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.grid3 .field{margin:6px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted);background:var(--bg)}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.mode{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin:6px 0 4px}
.mode button{flex:1;border:0;background:none;border-radius:9px;padding:7px;font-size:14px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.results{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.result{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px}
.result img,.result .noimg{width:34px;height:48px;object-fit:cover;border-radius:4px;background:var(--line);flex:none}
.dup{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:6px}
.dup:empty{display:none}
.hint{font-size:12px;color:var(--muted)}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
fieldset.loan{border:1px dashed var(--line);border-radius:12px;padding:4px 12px 10px;margin:14px 0}
fieldset.loan legend{font-size:13px;color:var(--muted);padding:0 6px}
.rate{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate label{font-size:24px;color:var(--line);cursor:pointer;line-height:1}
.rate input:checked~label,.rate label:hover,.rate label:hover~label{color:var(--reading)}
.rate input:focus-visible+label{outline:2px solid var(--accent)}

/* covers: real image on top of a generated typographic cover */
.cv{position:relative;display:block;flex:none;aspect-ratio:2/3;border-radius:3px 7px 7px 3px;overflow:hidden;background:var(--c,#8a7f70);color:#fff;container-type:inline-size;box-shadow:0 1px 2px rgba(41,35,29,.14),0 8px 18px -6px rgba(41,35,29,.28)}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.14) 3.5%,rgba(0,0,0,.05) 7%,transparent 10%);pointer-events:none;z-index:2}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface);z-index:1}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;gap:4cqi;padding:13cqi 10cqi 10cqi 15cqi;background:linear-gradient(165deg,rgba(255,255,255,.16),transparent 50%,rgba(0,0,0,.12))}
.gen b{font:900 14cqi/1.28 var(--display);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gen i{font:900 26cqi/1 var(--display);font-style:normal;margin-top:auto;opacity:.92}
.gen small{font-size:8.5cqi;line-height:1.3;opacity:.85;margin-top:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gen i+small{margin-top:3cqi}
.cv-sm{width:44px}.cv-sm .gen{padding:0;align-items:center;justify-content:center}.cv-sm .gen b{font-size:44cqi}
.cv-md{width:62px}.cv-md .gen b{-webkit-line-clamp:4}
.cv-lg{width:104px}.cv-xl{width:150px}.cv-fill{width:100%}

.top>div{min-width:0}
.bar-top{position:sticky;top:0;padding-top:calc(10px + env(safe-area-inset-top,0px));z-index:6;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -16px;padding-inline:8px 16px}
.bar-top .icon-btn{color:var(--ink)}
.link{border:0;background:none;color:var(--accent);font-size:13.5px;font-weight:500;padding:4px 0}
h2.sec .vt{margin-left:auto}
h2.sec small{margin-right:auto}
.vt{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.vt button{border:0;background:none;width:34px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.vt svg{width:18px;height:18px}
.vt button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.btn svg{width:18px;height:18px;vertical-align:-4px;margin-right:4px}

/* cover grid (3 across on phones) */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 14px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gi{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0;color:inherit}
.cvbox{position:relative;display:block}
.gt{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gs{font-size:11.5px;color:var(--muted);margin-top:-4px}
.badge{position:absolute;left:6px;bottom:6px;z-index:3;font-size:10.5px;font-weight:700;color:#fff;background:var(--c);border-radius:99px;padding:1px 7px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
/* a series is a little stack of covers */
.stk{margin:0 7px 7px 0}
.stk::before,.stk::after{content:"";position:absolute;inset:0;border-radius:3px 7px 7px 3px;background:color-mix(in srgb,var(--c) 55%,var(--bg));box-shadow:0 1px 2px rgba(41,35,29,.15)}
.stk::before{transform:translate(7px,7px);opacity:.55}
.stk::after{transform:translate(3.5px,3.5px)}
.stk .cv{z-index:1}
.cnt{position:absolute;right:-4px;top:-6px;z-index:3;min-width:24px;height:24px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}

/* horizontal rails */
.rail,.cats{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:4px 16px 12px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar,.cats::-webkit-scrollbar{display:none}
.ri{flex:none;width:108px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;color:inherit}
.cat{flex:none;width:104px;border:0;background:none;padding:0;text-align:center;color:inherit;scroll-snap-align:start}
.cat .box{position:relative;height:108px;display:flex;align-items:flex-end;justify-content:center}
.cat .box::before{content:"";position:absolute;inset:auto 0 0;height:58%;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.cat .cv{margin-bottom:12px}
.cat b{display:block;font-size:14px;margin-top:8px}
.cat>span:last-child{font-size:12px;color:var(--muted)}
.cat[aria-pressed="true"] .box::before{background:var(--accent-soft);outline:2px solid var(--accent)}

/* book + series pages */
.hero{margin:0 -16px;padding:8px 16px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(color-mix(in srgb,var(--c) 22%,var(--bg)),var(--bg))}
.hero .cv{margin:6px 0 8px}
.bt{font:900 24px/1.3 var(--display);margin:0;text-wrap:balance}
.slink{border:0;background:var(--surface);border-radius:99px;padding:4px 12px;color:var(--accent);font-size:13.5px;box-shadow:var(--shadow);margin-top:4px}
.stseg{margin:4px 0 14px}
.info{padding:4px 14px}
.kv{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv>span{width:64px;flex:none;color:var(--muted);font-size:13.5px}
.kv b{flex:1;font-weight:500}
.kv.note{align-items:flex-start}.kv p{margin:0;flex:1;white-space:pre-wrap}
.shead{display:flex;gap:16px;align-items:flex-end;margin-top:4px}
.shead>div{flex:1;min-width:0}
.cvrow{display:flex;gap:14px;align-items:center;margin:10px 0 4px}
.emptycv{display:flex;justify-content:center;margin:10px 0 4px}
.empty .btn{margin-top:0}
.ocr-done{color:var(--accent);font-weight:700;font-size:14px;margin-bottom:8px}
.ocr-lines{max-height:220px;overflow:auto}
.ocr-more{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.notfound{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px}

/* cover camera */
.scan.shoot video{aspect-ratio:3/4}
.scan.shoot.page .frame{width:88%;aspect-ratio:3/4;top:46%}
.scan.shoot .frame{left:50%;right:auto;top:47%;height:auto;width:64%;aspect-ratio:2/3;transform:translate(-50%,-50%);border-radius:6px 10px 10px 6px;box-shadow:0 0 0 999px rgba(0,0,0,.5)}
.shoot-tip{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.scan.shoot .bottom{justify-content:space-between;padding:14px 18px 18px}
.scan.shoot .bottom .ghost{background:none;color:#fff;font-weight:500;min-width:64px}
.scan.shoot .bottom .shutter{width:66px;height:66px;border-radius:50%;padding:0;background:#fff;box-shadow:0 0 0 4px #000,0 0 0 7px #fff}
.ocr{background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0}
.ocr-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ocr .tagbox{margin-top:8px}
.ocr-status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);padding:6px 0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.mini-seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.mini-seg button{white-space:nowrap;border:0;background:none;border-radius:7px;padding:3px 10px;font-size:13px;color:var(--muted)}
.mini-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
/* scanner */
dialog.scan{border:0;padding:0;background:#000;color:#fff;width:100%;max-width:520px;border-radius:20px;overflow:hidden}
.scan video{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#111}
.scan .frame{position:absolute;left:12%;right:12%;top:38%;height:22%;border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan .bottom{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.scan .bottom button{border:0;border-radius:10px;padding:8px 14px;background:#fff;color:#000;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
body.welcoming .tabbar{display:none}
.wz{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.wz-dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.wz-dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .2s}
.wz-dots i.on{width:22px;background:var(--accent)}
.wz h1{font:900 28px/1.3 var(--display);margin:0 0 6px;text-wrap:balance}
.wz .lead{color:var(--muted);margin:0 0 18px}
.wz .body{flex:1}
.wz-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.wz-foot .btn{padding:12px 22px;font-size:16px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.feat:first-child{border-top:0}
.feat .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px;flex:none}
.feat b{display:block}
.feat p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent)}
.opt b{display:block}.opt span.small{display:block}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 6px 5px 12px;background:var(--accent-soft);color:var(--accent);font-size:14px;border:0}
.tag b{font-weight:400;opacity:.7;padding:0 4px}
.tag.sug{background:transparent;border:1px dashed var(--line);color:var(--muted);padding-right:12px}
.goalpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.goalpick button{flex:1;min-width:64px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 0;font:900 22px/1 var(--display)}
.goalpick button small{display:block;font:400 12px/1.4 var(--body);color:var(--muted);margin-top:4px}
.goalpick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.how{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.how h3{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center}
.how ol{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.how ol li{margin:2px 0}
.how .btn{margin-top:10px}
textarea.bulk{min-height:180px;font-size:15px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabbar"><div class="tabbar-in">
  <button class="tab" data-tab="shelf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5h4v15H4zM10 5h4v15h-4zM15.5 6.2l3.8-1 3.4 13.6-3.8 1z"/></svg>書房</button>
  <button class="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>讀書計畫</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
</div></nav>

<dialog class="sheet" id="sheet"><form id="form" autocomplete="off" novalidate></form></dialog>
<dialog class="scan" id="scan" aria-label="掃描條碼">
  <div style="position:relative"><video id="video" playsinline muted></video><div class="frame"></div></div>
  <div class="bottom"><span id="scanMsg">對準書背 978 開頭的條碼</span><button type="button" id="scanClose">取消</button></div>
</dialog>

<dialog class="scan shoot" id="shoot" aria-label="拍封面">
  <div style="position:relative"><video id="shootVideo" playsinline muted></video><div class="frame" id="shootFrame"></div><div class="shoot-tip">把書的封面對準框框</div></div>
  <div class="bottom"><button type="button" id="shootCancel" class="ghost">取消</button><button type="button" id="shootBtn" class="shutter" aria-label="拍照"></button><button type="button" id="shootLib" class="ghost">選照片</button></div>
</dialog>

<script>
/* ---------- basics ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const safeUrl=u=>/^https:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'');
const daysSince=d=>d?Math.max(0,Math.floor((Date.now()-new Date(d+'T00:00:00'))/864e5)):0;
const dateOf=ts=>{const d=new Date(ts);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const zhSort=(a,b)=>String(a).localeCompare(String(b),'zh-Hant-TW-u-co-stroke',{numeric:true});

function isbn13(s){
  s=String(s||'').replace(/[^0-9Xx]/g,'').toUpperCase();
  if(s.length===13&&/^\d+$/.test(s))return s;
  if(s.length===10){const b='978'+s.slice(0,9);let sum=0;for(let i=0;i<12;i++)sum+=+b[i]*(i%2?3:1);return b+((10-sum%10)%10)}
  return '';
}
const looksIsbn=q=>/^[\d\-\sXx]{10,17}$/.test(q.trim())&&!!isbn13(q);

const STATUS={unread:'未讀',reading:'閱讀中',done:'讀完',dropped:'放棄'};
const FORMATS={paper:'紙本',readmoo:'讀墨',kobo:'Kobo',kindle:'Kindle',ebook:'其他電子書'};

/* ---------- genres (auto-classified, can be overridden) ---------- */
// Specific genres first, so "Juvenile Fiction / Mystery" lands in 推理 rather than 小說.
const GENRES=[
  ['漫畫','#d9733a',['漫畫','comic','manga','graphic novel','コミック']],
  ['繪本童書','#e0a33a',['繪本','童書','兒童','picture book','juvenile','children']],
  ['推理懸疑','#45618f',['推理','懸疑','偵探','謀殺','殺人','犯罪','密室','mystery','thriller','crime','detective','suspense']],
  ['奇幻科幻','#7a6c9c',['奇幻','科幻','魔法','fantasy','science fiction','sci-fi','dystopia']],
  ['愛情','#c9466f',['愛情','戀','romance','love story']],
  ['輕小說','#d0618c',['輕小說','light novel']],
  ['傳記回憶','#a3803a',['傳記','自傳','回憶錄','biography','memoir','autobiography']],
  ['散文詩集','#9c5a7a',['散文','隨筆','詩','札記','poetry','poems','essays']],
  ['語言學習','#3f7d8c',['英文','日文','韓文','單字','文法','多益','雅思','托福','language arts','foreign language','toeic','ielts']],
  ['電腦科技','#4a6fa5',['程式','電腦','軟體','人工智慧','演算法','數位','computers','programming','technology','python','javascript']],
  ['商業理財','#5b7f4f',['商業','理財','投資','經濟','管理','行銷','創業','財富','股票','職場','領導','business','economics','finance','investing','marketing','management']],
  ['心理勵志','#b88a2b',['心理','勵志','習慣','勇氣','自我','成長','焦慮','情緒','療癒','幸福','正念','self-help','psychology','happiness','habits']],
  ['哲學宗教','#6d6a7c',['哲學','思考','宗教','心靈','倫理','佛','聖經','philosophy','ethics','religion']],
  ['人文歷史','#b5654f',['歷史','文明','帝國','戰爭','history','civilization']],
  ['社會科學','#5e8c8a',['社會','政治','性別','教育','法律','新聞','social science','political','education','law']],
  ['自然科普','#2f9e4f',['科學','宇宙','物理','生物','演化','數學','大腦','基因','自然','動物','science','physics','biology','mathematics','nature','evolution']],
  ['藝術設計','#c05a86',['藝術','設計','攝影','音樂','電影','建築','art','design','photography','music','architecture']],
  ['生活風格','#7fa04f',['料理','烹飪','食譜','旅行','旅遊','健康','運動','收納','家居','園藝','寵物','育兒','cooking','travel','health','fitness','gardening','parenting']],
  ['文學小說','#8a5a9c',['小說','文學','物語','fiction','novel','literary','literature']],
].map(([k,c,kw])=>({k,c,re:new RegExp(kw.map(w=>/^[\x00-\x7f]+$/.test(w)?`\\b${w}\\b`:w).join('|'),'i')}));
const OTHER={k:'其他',c:'#8a7f70'};
const AUTHOR_GENRE={
  '尾田榮一郎':'漫畫','鳥山明':'漫畫','青山剛昌':'漫畫','岸本齊史':'漫畫','吾峠呼世晴':'漫畫','諫山創':'漫畫','富樫義博':'漫畫','荒木飛呂彥':'漫畫','井上雄彥':'漫畫','藤本樹':'漫畫','芥見下々':'漫畫','遠藤達哉':'漫畫','高橋留美子':'漫畫','浦澤直樹':'漫畫','荒川弘':'漫畫','藤子・F・不二雄':'漫畫','藤子不二雄':'漫畫','安達充':'漫畫','堀越耕平':'漫畫','山田鐘人':'漫畫','九井諒子':'漫畫','幾米':'繪本童書',
  '東野圭吾':'推理懸疑','宮部美幸':'推理懸疑','湊佳苗':'推理懸疑','阿嘉莎':'推理懸疑','克莉絲蒂':'推理懸疑','Agatha Christie':'推理懸疑','柯南・道爾':'推理懸疑','島田莊司':'推理懸疑','京極夏彥':'推理懸疑','伊坂幸太郎':'推理懸疑',
  '劉慈欣':'奇幻科幻','羅琳':'奇幻科幻','Rowling':'奇幻科幻','托爾金':'奇幻科幻','Tolkien':'奇幻科幻','艾西莫夫':'奇幻科幻','上橋菜穗子':'奇幻科幻','喬治・馬汀':'奇幻科幻',
  '村上春樹':'文學小說','太宰治':'文學小說','夏目漱石':'文學小說','川端康成':'文學小說','馬奎斯':'文學小說','卡繆':'文學小說','張愛玲':'文學小說','聖修伯里':'文學小說','吉本芭娜娜':'文學小說','韓江':'文學小說',
  '哈拉瑞':'人文歷史','Harari':'人文歷史','岸見一郎':'心理勵志','James Clear':'心理勵志','詹姆斯・克利爾':'心理勵志',
  '三毛':'散文詩集','余光中':'散文詩集','席慕蓉':'散文詩集','蔣勳':'藝術設計'};
// hint = categories + description saved when the book was picked from an online search
function classify(b){
  const author=String(b.author||'');
  for(const[a,g]of Object.entries(AUTHOR_GENRE))if(author.includes(a))return g;
  const [cats='',desc='']=String(b.hint||'').split('\n');
  for(const text of[`${b.title||''} ${b.series||''} ${cats}`,desc]){const g=GENRES.find(g=>g.re.test(text));if(g)return g.k}
  return OTHER.k;
}
const genreOf=b=>b.genre||classify(b);
const genreColor=k=>(GENRES.find(g=>g.k===k)||OTHER).c;

// "哈利波特(1)：神秘的魔法石" / "鬼滅之刃 3" / "航海王 第100集" → {series, vol}. loose=true also accepts a bare trailing number.
function guessSeries(t,loose){
  t=String(t||'').trim();let m;
  if((m=t.match(/^(.+?)\s*[（(]\s*(\d{1,3})\s*[)）]/)))return{series:m[1].trim(),vol:+m[2]};
  if((m=t.match(/^(.+?)\s*第\s*(\d{1,3})\s*[集卷冊部話]/)))return{series:m[1].trim(),vol:+m[2]};
  if((m=t.match(/^(.+?)\s*vol\.?\s*(\d{1,3})\b/i)))return{series:m[1].trim(),vol:+m[2]};
  if(loose&&(m=t.match(/^(.*\D)\s+(\d{1,3})\s*[集卷冊]?$/))&&/[^\d\s]/.test(m[1]))return{series:m[1].trim(),vol:+m[2]};
  if(loose&&(m=t.match(/^(.*[㐀-鿿぀-ヿ])(\d{1,3})\s*[集卷冊]?$/)))return{series:m[1].trim(),vol:+m[2]};
  return null;
}

/* ---------- storage ---------- */
const KEY='my-bookroom-v1', OLD_KEY='melody-diary-v1';
let db={books:[],goal:12,pick:null,migrated:false,setup:false,formatsUsed:Object.keys(FORMATS),locations:[]};
try{const raw=localStorage.getItem(KEY);if(raw)db=Object.assign(db,JSON.parse(raw))}catch(e){}
if(!db.setup&&db.books.length)db.setup=true; // existing libraries skip the welcome
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('無法儲存：瀏覽器封鎖了本機儲存空間')}};
const getBook=id=>db.books.find(b=>b.id===id);
const addedDate=b=>b.bought||dateOf(b.added||Date.now());

/* ---------- matching (the "do I already own this?" check) ---------- */
function matches(b,q){
  q=q.trim();if(!q)return true;
  if(looksIsbn(q))return isbn13(b.isbn)===isbn13(q);
  const nq=norm(q);if(!nq)return true;
  const hay=norm([b.title,b.author,b.series,b.publisher,b.location,b.note,b.loan?.to].join('|'));
  if(hay.includes(nq))return true;
  const nt=norm(b.title);return nt.length>=2&&nq.includes(nt);
}
function similar(title,isbn,exceptId){
  const nt=norm(title),i13=isbn13(isbn);
  return db.books.filter(b=>{if(b.id===exceptId)return false;
    if(i13&&isbn13(b.isbn)===i13)return true;
    const bt=norm(b.title);if(!nt||nt.length<2||!bt)return false;
    return bt===nt||(nt.length>=3&&bt.includes(nt))||(bt.length>=3&&nt.includes(bt));});
}

/* ---------- cover photos (IndexedDB; the book only keeps the key) ---------- */
const COV=new Map();
const idb=new Promise((res,rej)=>{try{const r=indexedDB.open('my-bookroom',1);r.onupgradeneeded=()=>r.result.createObjectStore('covers');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
idb.catch(()=>{});
const covTx=(mode,fn)=>idb.then(d=>new Promise((res,rej)=>{const t=d.transaction('covers',mode);fn(t.objectStore('covers'));t.oncomplete=res;t.onerror=()=>rej(t.error)}));
const loadCovers=()=>idb.then(d=>new Promise(res=>{const q=d.transaction('covers').objectStore('covers').openCursor();q.onsuccess=()=>{const c=q.result;if(!c)return res();if(/^data:image\//.test(c.value))COV.set(c.key,c.value);c.continue()};q.onerror=()=>res()})).catch(()=>{});
const putCover=(key,data)=>{COV.set(key,data);return covTx('readwrite',s=>s.put(data,key)).catch(()=>toast('照片存不下，手機空間可能不足'))};
const delCover=key=>{if(!key)return;COV.delete(key);return covTx('readwrite',s=>s.delete(key)).catch(()=>{})};
const coverSrc=b=>b._src!==undefined?b._src:((b.photo&&COV.get(b.photo))||safeUrl(b.cover));
function shrink(file,max=720,q=.8){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u});
}
// One hidden <input capture> opens the rear camera straight away on phones
const camIn=document.createElement('input');camIn.type='file';camIn.accept='image/*';camIn.setAttribute('capture','environment');camIn.hidden=true;document.body.append(camIn);
function pickPhoto(cb,capture=true,max=720){capture?camIn.setAttribute('capture','environment'):camIn.removeAttribute('capture');camIn.value='';camIn.onchange=async()=>{const f=camIn.files[0];if(!f)return;try{cb(await shrink(f,max))}catch(e){toast('讀不到這張照片')}};camIn.click()}

/* ---------- UI state + routing (#shelf, #plan, #settings, #book/<id>, #series/<key>) ---------- */
const ui={tab:'shelf',q:'',status:'',fmt:'',genre:'',sort:'recent',view:db.view||'grid',online:null,bookId:null,series:null,scroll:0,inApp:false};
function parseHash(){
  const [t,arg]=decodeURIComponent(location.hash.slice(1)).split('/');
  if(t==='book'&&getBook(arg))return{tab:'book',bookId:arg};
  if(t==='series'&&arg&&seriesBooks(arg).length)return{tab:'series',series:arg};
  return{tab:['plan','settings'].includes(t)?t:'shelf'};
}
function applyRoute(){
  if(!db.setup)return;
  const prev=ui.tab;if(prev==='shelf')ui.scroll=window.scrollY;
  Object.assign(ui,parseHash());render();
  window.scrollTo(0,ui.tab==='shelf'&&(prev==='book'||prev==='series')?ui.scroll:0);
}
function go(tab,arg){
  const h=arg?`${tab}/${encodeURIComponent(arg)}`:tab;ui.inApp=true;
  if(decodeURIComponent(location.hash.slice(1))===h)applyRoute();else location.hash=h;
}
function back(){if(ui.inApp&&history.length>1)history.back();else go('shelf')}
$$('.tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.tab)));
window.addEventListener('hashchange',applyRoute);

function render(){
  const cur=['book','series'].includes(ui.tab)?'shelf':ui.tab;
  $$('.tab').forEach(t=>t.dataset.tab===cur?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current'));
  const app=$('#app');
  document.body.classList.toggle('welcoming',ui.tab==='welcome');
  if(ui.tab==='welcome')app.innerHTML=viewWelcome();
  else if(ui.tab==='plan')app.innerHTML=viewPlan();
  else if(ui.tab==='settings')app.innerHTML=viewSettings();
  else if(ui.tab==='book'&&getBook(ui.bookId))app.innerHTML=viewBook(getBook(ui.bookId));
  else if(ui.tab==='series'&&seriesBooks(ui.series).length)app.innerHTML=viewSeries(ui.series);
  else{ui.tab='shelf';app.innerHTML=viewShelf()}
}

/* ---------- pieces ---------- */
// A real cover when we have one; otherwise a generated typographic cover in the genre colour.
function coverHtml(b,size='sm'){
  const src=coverSrc(b),name=(b.series||b.title||'').trim();
  const text=size==='sm'?name.slice(0,1):name;
  return`<span class="cv cv-${size}" style="--c:${genreColor(genreOf(b))}" aria-hidden="true"><span class="gen"><b>${esc(text)}</b>${b.vol&&size!=='sm'?`<i>${b.vol}</i>`:''}${b.author&&size!=='sm'&&size!=='md'?`<small>${esc(b.author)}</small>`:''}</span>${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`;
}
const fmtNames=b=>(b.formats||[]).map(f=>FORMATS[f]||f).join('、');
const fmtBadges=b=>`<span class="fmts">${(b.formats||[]).map(f=>`<span class="fmt">${esc(FORMATS[f]||f)}</span>`).join('')}${b.loan?`<span class="fmt loan">借給 ${esc(b.loan.to||'?')}</span>`:''}</span>`;
const statusPill=b=>`<span class="pill st-${b.status}">${STATUS[b.status]||''}</span>`;
const stLine=b=>b.loan?`<span class="gs" style="color:var(--warn)">借給 ${esc(b.loan.to||'?')}</span>`:b.status!=='unread'?`<span class="gs" style="color:var(--${b.status})">● ${STATUS[b.status]}</span>`:'';
function bookRow(b){
  const sub=[b.author,b.location&&(b.formats||[]).includes('paper')?'📍'+b.location:''].filter(Boolean).join(' · ');
  return`<button class="row" data-open="${esc(b.id)}">${coverHtml(b)}<span class="meta"><b>${esc(b.title)}</b>${sub?`<span class="sub">${esc(sub)}</span>`:''}${fmtBadges(b)}</span>${statusPill(b)}</button>`;
}
function gridItem(b){return`<button class="gi" data-open="${esc(b.id)}"><span class="cvbox">${coverHtml(b,'fill')}</span><span class="gt">${esc(b.title)}</span>${stLine(b)}</button>`}
const seriesKey=b=>norm(b.series);
const seriesBooks=key=>db.books.filter(b=>b.series&&seriesKey(b)===key).sort((a,b)=>(a.vol||999)-(b.vol||999)||zhSort(a.title,b.title));
function seriesInfo(key){
  const all=seriesBooks(key),vols=all.filter(b=>b.vol).map(b=>b.vol),max=Math.max(0,...vols),min=Math.min(...vols,1);
  return{all,first:all.find(b=>coverSrc(b))||all[0],done:all.filter(b=>b.status==='done').length,max,min,missing:vols.length?(max-min+1)-new Set(vols).size:0,vols};
}
function volChips(key){
  const s=seriesInfo(key);let chips='';
  if(s.vols.length&&s.max-s.min<300)for(let v=s.min;v<=s.max;v++){const bs=s.all.filter(b=>b.vol===v);
    chips+=bs.length?bs.map(b=>`<button class="vol st-${b.status}" style="--c:var(--${b.status})" data-open="${esc(b.id)}" aria-label="第 ${v} 集，${STATUS[b.status]}">${v}</button>`).join('')
      :`<span class="vol missing" title="沒有第 ${v} 集">${v}</span>`;}
  s.all.filter(b=>!b.vol).forEach(b=>chips+=`<button class="vol st-${b.status}" style="--c:var(--${b.status})" data-open="${esc(b.id)}" aria-label="${esc(b.title)}">·</button>`);
  return chips+`<button class="vol next" data-next="${esc(key)}" aria-label="加入下一集">＋${s.max?s.max+1:''}</button>`;
}
function gridSeries(key){
  const s=seriesInfo(key);
  return`<button class="gi" data-series="${esc(key)}"><span class="cvbox stk" style="--c:${genreColor(genreOf(s.first))}">${coverHtml({...s.first,vol:0},'fill')}<span class="cnt">${s.all.length}</span></span><span class="gt">${esc(s.first.series)}</span><span class="gs">讀完 ${s.done}/${s.all.length}${s.missing?`・缺 ${s.missing} 集`:''}</span></button>`;
}
function listSeries(key){
  const s=seriesInfo(key);
  return`<div class="series"><button class="row" data-series="${esc(key)}">${coverHtml({...s.first,vol:0})}<span class="meta"><b>${esc(s.first.series)}</b><span class="sub">${esc(s.first.author||'')}</span><span class="count">共 ${s.all.length} 本${s.max?`・到第 ${s.max} 集`:''}・讀完 ${s.done}${s.missing?`・缺 ${s.missing} 集`:''}</span></span><span class="muted" aria-hidden="true">›</span></button><div class="vols">${volChips(key)}</div></div>`;
}
const legend=`<div class="legend"><span><i class="o" style="--c:var(--unread)"></i>未讀</span><span><i style="--c:var(--reading)"></i>閱讀中</span><span><i style="--c:var(--done)"></i>讀完</span><span><i class="o" style="--c:var(--muted);border-style:dashed"></i>沒有這集</span></div>`;
const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>',

};

/* ---------- shelf (home) ---------- */
function filtered(){
  return db.books.filter(b=>matches(b,ui.q)
    &&(ui.q||((!ui.status||(ui.status==='loan'?!!b.loan:b.status===ui.status))
    &&(!ui.fmt||(ui.fmt==='ebook-any'?(b.formats||[]).some(f=>f!=='paper'):(b.formats||[]).includes(ui.fmt)))
    &&(!ui.genre||genreOf(b)===ui.genre))));
}
function sortBooks(list){
  const by={recent:(a,b)=>(b.added||0)-(a.added||0),title:(a,b)=>zhSort(a.series||a.title,b.series||b.title)||(a.vol||0)-(b.vol||0),
    author:(a,b)=>zhSort(a.author||'~',b.author||'~')||zhSort(a.title,b.title),oldest:(a,b)=>addedDate(a).localeCompare(addedDate(b))};
  return list.sort(by[ui.sort]||by.recent);
}
function shelfItems(list){
  // series collapse into one item, kept at the position of their first matching volume
  const items=[],seen=new Set();
  for(const b of list){if(b.series){const k=seriesKey(b);if(!seen.has(k)){seen.add(k);items.push({k})}}else items.push(b)}
  return items;
}
function shelfHtml(items){
  if(!items.length)return'';
  if(ui.view==='list')return`<div class="list">${items.map(it=>it.k!==undefined?listSeries(it.k):bookRow(it)).join('')}</div>${items.some(it=>it.k!==undefined)?legend:''}`;
  return`<div class="grid">${items.map(it=>it.k!==undefined?gridSeries(it.k):gridItem(it)).join('')}</div>`;
}
function viewShelf(){
  const n=db.books.length,unread=db.books.filter(b=>b.status==='unread'),loans=db.books.filter(b=>b.loan).length;
  const list=sortBooks(filtered()),items=shelfItems(list);
  const chip=(k,v,l)=>`<button class="chip" data-f="${k}" data-v="${v}" aria-pressed="${ui[k]===v}">${l}</button>`;
  let old=null;try{if(!db.migrated){const o=JSON.parse(localStorage.getItem(OLD_KEY)||'null');if(o?.books?.length)old=o.books.length}}catch(e){}
  const viewToggle=`<div class="vt" role="group" aria-label="排列方式"><button data-view="grid" aria-pressed="${ui.view==='grid'}" aria-label="封面">${ICON.grid}</button><button data-view="list" aria-pressed="${ui.view==='list'}" aria-label="清單">${ICON.list}</button></div>`;
  let body='';
  if(!n)body=`<div class="empty"><div class="emptycv">${coverHtml({title:'我的書房',author:'第一本書',genre:'文學小說'},'lg')}</div><p>書房還是空的。<br>掃一下書背條碼，或拍封面，就能把書加進來。</p><div class="btns" style="justify-content:center"><button class="btn" data-scan="home-add">${ICON.scan}掃條碼</button><button class="btn ghost" data-photo="new">${ICON.cam}拍封面</button></div><p><button class="btn sm ghost" data-guide>看教學</button></p></div>`;
  else if(ui.q)body=`<div id="verdict">${verdictHtml(list)}</div>${shelfHtml(items)}`;
  else{
    // "keep reading" rail: books in progress, then the ones that have waited longest
    const reading=db.books.filter(b=>b.status==='reading');
    const pick=db.pick&&getBook(db.pick.id);
    const waiting=[...(pick&&pick.status==='unread'?[pick]:[]),...[...unread].sort((a,b)=>addedDate(a).localeCompare(addedDate(b)))].filter((b,i,a)=>a.indexOf(b)===i).slice(0,8);
    const rail=[...reading.map(b=>[b,'<span class="gs" style="color:var(--reading)">閱讀中</span>']),...waiting.map(b=>[b,`<span class="gs">放了 ${daysSince(addedDate(b))} 天</span>`])];
    const counts={};db.books.forEach(b=>{const g=genreOf(b);counts[g]=(counts[g]||0)+1});
    const cats=Object.entries(counts).sort((a,b)=>b[1]-a[1]||zhSort(a[0],b[0]));
    const repr=g=>db.books.filter(b=>genreOf(b)===g).sort((a,b)=>!!coverSrc(b)-!!coverSrc(a)||(b.added||0)-(a.added||0))[0];
    body=`${rail.length?`<h2 class="sec">${reading.length?'繼續閱讀':'該讀了'}<button class="link" data-tab-go="plan">讀書計畫 ›</button></h2>
      <div class="rail">${rail.map(([b,s])=>`<button class="ri" data-open="${esc(b.id)}">${coverHtml(b,'fill')}<span class="gt">${esc(b.title)}</span>${s}</button>`).join('')}</div>`:''}
    ${cats.length>1?`<h2 class="sec">類別</h2><div class="cats">${cats.map(([g,c])=>`<button class="cat" data-genre="${esc(g)}" aria-pressed="${ui.genre===g}"><span class="box">${coverHtml({...repr(g),vol:0},'md')}</span><b>${esc(g)}</b><span>${c} 本</span></button>`).join('')}</div>`:''}
    <h2 class="sec" id="shelfSec">我的書櫃 <small>${list.length===n?`${n} 本`:`${list.length} / ${n} 本`}</small>${viewToggle}</h2>
    <div class="chips" role="group" aria-label="篩選">${ui.genre?`<button class="chip" data-genre="${esc(ui.genre)}" aria-pressed="true">${esc(ui.genre)} ✕</button>`:''}${chip('status','','全部')}${Object.entries(STATUS).map(([k,l])=>chip('status',k,l)).join('')}${loans?chip('status','loan',`借出中 ${loans}`):''}</div>
    <div class="tools"><select id="fFmt" aria-label="格式"><option value="">所有格式</option><option value="paper" ${ui.fmt==='paper'?'selected':''}>紙本</option><option value="ebook-any" ${ui.fmt==='ebook-any'?'selected':''}>所有電子書</option>${usedFormats().filter(([k])=>k!=='paper').map(([k,l])=>`<option value="${k}" ${ui.fmt===k?'selected':''}>${l}</option>`).join('')}</select>
      <select id="fSort" aria-label="排序">${[['recent','最近加入'],['title','書名'],['author','作者'],['oldest','放最久']].map(([k,l])=>`<option value="${k}" ${ui.sort===k?'selected':''}>${l}</option>`).join('')}</select></div>
    ${shelfHtml(items)||'<div class="empty">沒有符合條件的書</div>'}`;
  }
  return`<header class="top"><div><h1>我的書房</h1>${n?`<div class="small muted">${n} 本書・${unread.length} 本還沒讀</div>`:''}</div><button class="add" data-add aria-label="新增書">＋</button></header>
  ${old?`<div class="banner">舊的「旋律日記」書櫃裡有 <b>${old}</b> 本書，要搬進書房嗎？<div class="acts"><button class="btn sm" data-migrate>搬過來</button><button class="btn sm ghost" data-migrate-no>不用了</button></div></div>`:''}
  ${n?`<div class="search"><div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted);flex:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="我有這本嗎？書名、作者、ISBN" value="${esc(ui.q)}" enterkeyhint="search">
    ${ui.q?`<button class="icon-btn" data-clear aria-label="清除">✕</button>`:''}
    <button class="icon-btn" data-photo="new" aria-label="拍封面新增">${ICON.cam}</button>
    <button class="icon-btn solid" data-scan="home" aria-label="掃描書背條碼">${ICON.scan}</button>
  </div></div>`:''}
  ${body}`;
}

/* ---------- one book ---------- */
function viewBook(b){
  const g=genreColor(genreOf(b)),key=b.series?seriesKey(b):'';
  const rows=[['格式',fmtNames(b)],['類別',genreOf(b)],['放在哪',(b.formats||[]).includes('paper')?b.location:''],['買的日期',b.bought],['開始讀',b.started],['讀完',b.finished],['出版社',b.publisher],['ISBN',b.isbn],
    ['評分',b.rating?'★'.repeat(b.rating)+'☆'.repeat(5-b.rating):'']].filter(r=>r[1]);
  return`<header class="top bar-top"><button class="icon-btn" data-back aria-label="返回">${ICON.back}</button><button class="btn sm ghost" data-edit="${esc(b.id)}">編輯</button></header>
  <div class="hero" style="--c:${g}">${coverHtml(b,'xl')}
    <h1 class="bt">${esc(b.title)}</h1>${b.author?`<div class="muted">${esc(b.author)}</div>`:''}
    ${key?`<button class="slink" data-series="${esc(key)}">${esc(b.series)}${b.vol?`・第 ${b.vol} 集`:''}・全套 ${seriesBooks(key).length} 本 ›</button>`:''}
    <div class="btns" style="justify-content:center"><button class="btn sm ghost" data-photo="${esc(b.id)}">${ICON.cam}${coverSrc(b)?'換封面':'拍封面'}</button>${b.photo?`<button class="btn sm danger" data-unphoto="${esc(b.id)}">移除照片</button>`:''}</div>
  </div>
  <div class="mode stseg" role="group" aria-label="狀態">${Object.entries(STATUS).map(([k,l])=>`<button data-setst="${k}" aria-pressed="${b.status===k}">${l}</button>`).join('')}</div>
  <div class="card info">${rows.map(([k,v])=>`<div class="kv"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}${b.note?`<div class="kv note"><span>備註</span><p>${esc(b.note)}</p></div>`:''}</div>
  <div class="card info" style="margin-top:12px">${b.loan?`<div class="kv"><span>借給</span><b>${esc(b.loan.to||'?')}<small class="muted">・${daysSince(b.loan.date)} 天</small></b><button class="btn sm ghost" data-return="${esc(b.id)}">還了</button></div>`
    :`<div class="kv"><span>借出</span><b class="muted" style="font-weight:400">在家</b><button class="btn sm ghost" data-edit="${esc(b.id)}" data-focus="loanTo">借給別人</button></div>`}</div>`;
}

/* ---------- one series ---------- */
function viewSeries(key){
  const s=seriesInfo(key),pct=Math.round(s.done/s.all.length*100);
  return`<header class="top bar-top"><button class="icon-btn" data-back aria-label="返回">${ICON.back}</button><span></span></header>
  <div class="shead">${coverHtml({...s.first,vol:0},'lg')}<div><h1 class="bt" style="text-align:left">${esc(s.first.series)}</h1><div class="muted">${esc(s.first.author||'')}</div>
    <div class="small muted" style="margin-top:6px">共 ${s.all.length} 本${s.max?`・到第 ${s.max} 集`:''}${s.missing?`・<span style="color:var(--warn)">缺 ${s.missing} 集</span>`:''}</div>
    <div class="bar"><i style="width:${pct}%"></i></div><div class="small">讀完 ${s.done} / ${s.all.length}</div></div></div>
  <div class="vols" style="padding:14px 0 4px">${volChips(key)}</div>${legend}
  <div class="btns"><button class="btn" data-next="${esc(key)}">＋ 第 ${s.max+1} 集</button><button class="btn ghost" data-setfill="${esc(key)}">一次補好幾集</button></div>
  <h2 class="sec">每一集</h2><div class="grid">${s.all.map(gridItem).join('')}</div>`;

function verdictHtml(list){
  if(!ui.q.trim())return'';
  const has=list.length,o=ui.online;
  let html='';
  if(has)html=`<div class="verdict have">你已經有 ${has} 本符合「${esc(ui.q)}」<span class="small">先看看下面，別再買一次囉。</span></div>`;
  else{
    // an ISBN that matched nothing locally: also try the title we looked up online
    let extra='';
    if(o&&o.q===ui.q&&o.title){const t=db.books.filter(b=>matches(b,o.title)||similar(o.title,'',null).includes(b));
      extra=t.length?`<div class="verdict have" style="margin-top:8px">這個條碼是《${esc(o.title)}》，書房裡有同名的書：<span class="small">${t.map(b=>esc(b.title)+'（'+(b.formats||[]).map(f=>FORMATS[f]).join('、')+'）').join('、')}</span></div>`:''}
    const loading=o&&o.q===ui.q&&o.loading;
    html=`<div class="verdict free">書房裡沒有「${esc(o?.q===ui.q&&o.title?o.title:ui.q)}」${loading?'<span class="small">查詢書名中…</span>':'<span class="small">可以放心買。</span>'}<button class="btn sm" data-add-q>加入書房</button></div>${extra}`;
  }
  return html;
}

/* ---------- plan (nudges) ---------- */
function viewPlan(){
  const y=String(new Date().getFullYear());
  const unread=db.books.filter(b=>b.status==='unread'),reading=db.books.filter(b=>b.status==='reading');
  const doneY=db.books.filter(b=>b.status==='done'&&(b.finished||'').startsWith(y)).length;
  const boughtY=db.books.filter(b=>addedDate(b).startsWith(y)).length;
  const goal=Math.max(1,+db.goal||12),pct=Math.min(100,Math.round(doneY/goal*100));
  const month=new Date().getMonth()+1,expected=Math.round(goal*month/12);
  let nudge='';
  if(doneY>=goal)nudge=`🎉 今年的目標達成了！`;
  else if(doneY>=expected)nudge=`進度超前，照這樣下去年底可以讀完 ${Math.round(doneY/month*12)} 本。`;
  else nudge=`照目標，到這個月應該讀完 ${expected} 本，還差 ${expected-doneY} 本。`;
  const diff=boughtY-doneY;
  const buyNote=boughtY?(diff>0?`今年買了 ${boughtY} 本、讀完 ${doneY} 本，未讀的書多了 ${diff} 本 😅`:`今年買了 ${boughtY} 本、讀完 ${doneY} 本，讀得比買得多 👍`):'';
  const pick=db.pick&&getBook(db.pick.id);const pickOk=pick&&pick.status==='unread';
  const oldest=[...unread].sort((a,b)=>addedDate(a).localeCompare(addedDate(b))).slice(0,5);
  const loans=db.books.filter(b=>b.loan);
  const weeks=unread.length;
  return`<header class="top"><h1>讀書計畫</h1></header>
  <div class="card"><div class="muted small">已買還沒讀</div><div class="big">${unread.length}<span style="font-size:18px"> 本</span></div>
    <div class="nudge muted">${weeks?`一週讀一本，要 ${weeks>=52?(weeks/52).toFixed(1)+' 年':weeks+' 週'}才讀得完。`:'沒有未讀的書，太厲害了！'}</div></div>

  <h2 class="sec">今天讀哪一本？</h2>
  <div class="card">${unread.length?(pickOk?`<div class="pick">${coverHtml(pick,'md')}<div class="meta"><h3>${esc(pick.title)}</h3><div class="muted small">${esc(pick.author||'')}${pick.author?' · ':''}${(pick.formats||[]).map(f=>FORMATS[f]).join('、')}</div><div class="muted small">已經放了 ${daysSince(addedDate(pick))} 天${pick.location?` · 📍${esc(pick.location)}`:''}</div></div></div>
      <div class="btns"><button class="btn" data-start="${esc(pick.id)}">就讀這本</button><button class="btn ghost" data-pick>換一本</button></div>`
    :`<p style="margin:0 0 4px">從 ${unread.length} 本未讀的書裡，隨機幫你挑一本。</p><div class="btns"><button class="btn" data-pick>幫我挑</button></div>`)
    :'<p class="muted" style="margin:0">沒有未讀的書可以挑。</p>'}</div>

  <h2 class="sec">閱讀中 <small>${reading.length} 本</small></h2>
  <div class="card">${reading.length?reading.map(b=>`<div class="line-item">${coverHtml(b)}<button class="meta" style="border:0;background:none;text-align:left;padding:0" data-open="${esc(b.id)}"><b>${esc(b.title)}</b><span class="sub">${b.started?`${daysSince(b.started)} 天前開始`:''}</span></button><button class="btn sm" data-finish="${esc(b.id)}">讀完了</button></div>`).join(''):'<p class="muted" style="margin:0">現在沒有在讀的書。挑一本開始吧！</p>'}</div>

  <h2 class="sec">${y} 年目標 <small>${doneY} / ${goal} 本</small></h2>

app.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-edit]');if(!t)return;
  const d=t.dataset;
  if(d.open)return go('book',d.open);
  if(d.series!==undefined)return go('series',d.series);
  if('back'in d)return back();
  if(d.edit){editBook(d.edit);if(d.focus)setTimeout(()=>form.elements[d.focus]?.focus(),60);return}
  if(d.next!==undefined)return addNext(d.next);
  if(d.setfill!==undefined){const s=seriesInfo(d.setfill);return openSet({series:s.first.series,author:s.first.author,from:s.max+1,formats:s.first.formats,location:s.first.location})}
  if(d.view){ui.view=db.view=d.view;save();return render()}
  if(d.genre!==undefined){ui.genre=ui.genre===d.genre?'':d.genre;render();if(ui.genre)$('#shelfSec')?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.tabGo)return go(d.tabGo);
  if(d.setst){const b=getBook(ui.bookId);if(!b)return;b.status=d.setst;if(b.status==='reading'&&!b.started)b.started=today();if(b.status==='done'&&!b.finished){b.finished=today();toast(`讀完《${b.title}》🎉`)}save();return render()}
  if(d.photo==='new')return shootCover(data=>{editBook(null,{_photo:data});readCover(data)});
  if(d.photo){const b=getBook(d.photo);return shootCover(async data=>{const k=b.photo||'c_'+uid();await putCover(k,data);b.photo=k;save();render();toast('封面換好了')})}
  if(d.unphoto){const b=getBook(d.unphoto);delCover(b.photo);b.photo='';save();return render()}
  if(d.f){ui[d.f]=ui[d.f]===d.v&&d.v?'':d.v;return render()}
  if('add'in d)return editBook(null);
  if('addQ'in d){const o=ui.online;return editBook(null,looksIsbn(ui.q)?{isbn:isbn13(ui.q),title:o?.title||'',author:o?.author||'',cover:o?.cover||'',pages:o?.pages||'',hint:o?.hint||''}:{title:ui.q.trim()})}
  if('clear'in d){ui.q='';ui.online=null;return render()}
  if(d.scan)return startScan(d.scan);
  if('pick'in d){const u=db.books.filter(b=>b.status==='unread'&&b.id!==db.pick?.id);const pool=u.length?u:db.books.filter(b=>b.status==='unread');
    // favour books that have waited longer: weight by days on the shelf
    const w=pool.map(b=>1+Math.sqrt(daysSince(addedDate(b))));let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<pool.length-1&&(r-=w[i])>0)i++;
    db.pick={id:pool[i].id,date:today()};save();return render()}
  if(d.start){const b=getBook(d.start);b.status='reading';b.started=b.started||today();if(db.pick?.id===b.id)db.pick=null;save();toast(`開始讀《${b.title}》，加油！`);return render()}
  if(d.finish){const b=getBook(d.finish);b.status='done';b.finished=today();save();toast(`讀完《${b.title}》🎉`);return render()}
  if(d.return){const b=getBook(d.return);b.loan=null;save();toast('已歸還');return render()}
  if('migrate'in d)return migrate();
  if('migrateNo'in d){db.migrated=true;save();return render()}
  if('bulk'in d)return openBulk();
  if('set'in d)return openSet();
  if('export'in d){const covers={};db.books.forEach(b=>{if(b.photo&&COV.has(b.photo))covers[b.photo]=COV.get(b.photo)});return download(`我的書房-${today()}.json`,JSON.stringify({app:'my-bookroom',version:2,...db,covers}),'application/json')}
  if('csv'in d)return exportCsv();
  if('guide'in d)return startWelcome();
  if('aitest'in d)return aiTest().then(render);
  if('aiclear'in d){try{localStorage.removeItem(AI_KEY)}catch(e){}toast('已移除金鑰');return render()}
  if('wipe'in d){if(confirm(`確定要刪除全部 ${db.books.length} 本書嗎？建議先匯出備份。`)){db.books=[];db.pick=null;save();toast('已清空');render()}}
});

/* ---------- online lookup ---------- */
const GB_KEY='my-bookroom-gbkey';
const gbKey=()=>{try{return localStorage.getItem(GB_KEY)||localStorage.getItem('melody-diary-gbkey')||''}catch(e){return''}};
const stripTags=t=>String(t||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
function jsonp(url,ms=8000){
  return new Promise((res,rej)=>{
    const cb='_jp'+uid().replace(/\W/g,''),sc=document.createElement('script');
    const done=(f,v)=>{window[cb]=()=>{};sc.remove();clearTimeout(t);f(v)};
    const t=setTimeout(()=>done(rej,new Error('timeout')),ms);
    window[cb]=d=>done(res,d);sc.onerror=()=>done(rej,new Error('jsonp'));
    sc.src=url+'&callback='+cb;document.head.append(sc);
  });
}
const getJson=async url=>{const r=await fetch(url,AbortSignal.timeout?{signal:AbortSignal.timeout(8000)}:{});if(!r.ok)throw new Error(r.status);return r.json()};
const SOURCES=[
  async q=>{const isb=looksIsbn(q)?isbn13(q):'';
    return((await getJson(`https://www.googleapis.com/books/v1/volumes?maxResults=6&q=${encodeURIComponent(isb?'isbn:'+isb:q)}${gbKey()?'&key='+encodeURIComponent(gbKey()):''}`)).items||[]).map(it=>{const v=it.volumeInfo||{};return{
    title:v.title+(v.subtitle?'：'+v.subtitle:''),author:(v.authors||[]).join('、'),pages:v.pageCount||'',cover:(v.imageLinks?.thumbnail||'').replace(/^http:/,'https:'),
    isbn:isbn13((v.industryIdentifiers||[]).find(x=>x.type==='ISBN_13')?.identifier||(v.industryIdentifiers||[]).find(x=>x.type==='ISBN_10')?.identifier||''),
    hint:`${(v.categories||[]).join(' / ')}\n${(v.description||'').slice(0,400).replace(/\n/g,' ')}`}})},
  async q=>(await jsonp(`https://itunes.apple.com/search?media=ebook&country=tw&limit=8&term=${encodeURIComponent(q)}`)).results.map(v=>({
    title:v.trackName,author:v.artistName||'',pages:'',cover:(v.artworkUrl100||'').replace('100x100bb','600x600bb'),isbn:'',
    hint:`${(v.genres||[]).join(' / ')}\n${stripTags(v.description).slice(0,400)}`})),
  async q=>{const isb=looksIsbn(q)?isbn13(q):'';
    return((await getJson(`https://openlibrary.org/search.json?limit=6&fields=title,author_name,number_of_pages_median,cover_i,subject,isbn&${isb?'isbn='+isb:'q='+encodeURIComponent(q)}`)).docs||[]).map(v=>({
    title:v.title,author:(v.author_name||[]).join('、'),pages:v.number_of_pages_median||'',cover:v.cover_i?`https://covers.openlibrary.org/b/id/${v.cover_i}-M.jpg`:'',
    isbn:isb||isbn13((v.isbn||[]).find(x=>x.length===13)||''),hint:`${(v.subject||[]).slice(0,8).join(' / ')}\n`}))},
];
async function lookup(q){
  const lists=await Promise.all(SOURCES.map(f=>f(q).catch(()=>null)));
  const seen=new Set();
  const out=lists.flat().filter(v=>{if(!v?.title||v.title==='undefined')return false;const k=norm(v.title+'|'+v.author);if(seen.has(k))return false;seen.add(k);return true}).slice(0,10);
  out.failed=lists.every(l=>l===null);return out;
}
async function lookupIsbnForHome(code){
  if(db.books.some(b=>isbn13(b.isbn)===isbn13(code)))return;
  ui.online={q:ui.q,loading:true};$('#verdict')&&($('#verdict').innerHTML=verdictHtml(filtered()));
  const r=await lookup(isbn13(code));if(ui.q!==code)return;
  ui.online={q:code,...(r[0]||{}),loading:false};
  if(ui.tab==='shelf'&&$('#verdict'))$('#verdict').innerHTML=verdictHtml(filtered());
}

/* ---------- barcode scanner ---------- */
const scanDlg=$('#scan'),video=$('#video');let scanState=null;
async function startScan(ctx){
  if(!navigator.mediaDevices?.getUserMedia)return toast('這個瀏覽器不能用相機，請直接輸入 ISBN');
  const wasSheet=sheet.open;
  scanState={ctx,stream:null,reader:null,stop:false,wasSheet};
  $('#scanMsg').textContent='對準書背 978 開頭的條碼';
  scanDlg.showModal();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    if(!scanState||scanState.stop){stream.getTracks().forEach(t=>t.stop());return}
    scanState.stream=stream;video.srcObject=stream;await video.play();
    const found=code=>{code=String(code).replace(/\D/g,'');if(/^97[89]\d{10}$/.test(code)){stopScan();onScanned(ctx,code)}else $('#scanMsg').textContent='這個不是 ISBN，找 978 開頭的那個條碼'};
    let native=false;
    if('BarcodeDetector'in window){try{const f=await BarcodeDetector.getSupportedFormats();native=f.includes('ean_13')}catch(e){}}
    if(native){
      const det=new BarcodeDetector({formats:['ean_13']});
      const loop=async()=>{if(!scanState||scanState.stop)return;try{const r=await det.detect(video);if(r[0])return found(r[0].rawValue)}catch(e){}setTimeout(loop,180)};loop();
    }else{
      if(!window.ZXing)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;s.onerror=rej;document.head.append(s)});
      if(!scanState||scanState.stop)return;
      const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]);
      const reader=new ZXing.BrowserMultiFormatReader(hints,250);scanState.reader=reader;
      reader.decodeFromStream(stream,video,res=>{if(res&&scanState&&!scanState.stop)found(res.getText())});
    }
  }catch(e){stopScan();toast(e&&e.name==='NotAllowedError'?'沒有相機權限，可以到 Safari 設定開啟':'無法開啟相機，請直接輸入 ISBN')}
}
function stopScan(){
  if(!scanState)return;scanState.stop=true;
  try{scanState.reader?.reset()}catch(e){}
  scanState.stream?.getTracks().forEach(t=>t.stop());video.srcObject=null;
  scanState=null;if(scanDlg.open)scanDlg.close();
}
$('#scanClose').addEventListener('click',stopScan);
scanDlg.addEventListener('cancel',stopScan);
function onScanned(ctx,code){
  if(navigator.vibrate)navigator.vibrate(60);
  if(ctx==='sheet'&&sheet.open&&form.elements.q){form.elements.q.value=code;form.elements.isbn.value=code;showDup();searchBooks();return}
  if(ctx==='home-add')return editBook(null,{isbn:code});
  if(ui.tab!=='shelf'){ui.tab='shelf';location.hash='shelf'}
  ui.q=code;ui.online=null;render();lookupIsbnForHome(code);
}

/* ---------- cover camera: line the book up with the frame, we crop to it ---------- */
const shootDlg=$('#shoot'),shootVideo=$('#shootVideo');let shootState=null;
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
// Photos picked from the library: keep the middle 2:3 part, which is where the book usually is.
async function cropCenter(dataUrl){
  const img=await loadImg(dataUrl);let w=img.width,h=img.height;
  if(w/h>2/3)w=h*2/3;else h=w*1.5;
  const k=Math.min(1,960/h),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(img,(img.width-w)/2,(img.height-h)/2,w,h,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.82);
}
function shootCover(cb,page=false){
  const fallback=()=>page?pickPhoto(cb,true,1800):pickPhoto(async d=>cb(await cropCenter(d)));
  if(!navigator.mediaDevices?.getUserMedia)return fallback();
  shootState={cb,stream:null,fallback,page};
  shootDlg.classList.toggle('page',page);$('.shoot-tip').textContent=page?'把版權頁（有書名、作者、ISBN 的那頁）放進框框':'把書的封面對準框框';
  shootDlg.showModal();
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false})
    .then(async st=>{if(!shootState){st.getTracks().forEach(t=>t.stop());return}shootState.stream=st;shootVideo.srcObject=st;await shootVideo.play()})
    .catch(e=>{closeShoot();if(e&&e.name==='NotAllowedError')toast('沒有相機權限，改用選照片');fallback()});
}
function closeShoot(){
  if(!shootState)return;shootState.stream?.getTracks().forEach(t=>t.stop());shootVideo.srcObject=null;shootState=null;if(shootDlg.open)shootDlg.close();
}
$('#shootBtn').addEventListener('click',()=>{
  const v=shootVideo;if(!shootState||!v.videoWidth)return;
  const vr=v.getBoundingClientRect(),r=$('#shootFrame').getBoundingClientRect();
  // map the on-screen frame back to video pixels (the video is shown with object-fit:cover)
  const scale=Math.max(vr.width/v.videoWidth,vr.height/v.videoHeight);
  const offX=(vr.width-v.videoWidth*scale)/2,offY=(vr.height-v.videoHeight*scale)/2;
  const sx=Math.max(0,(r.left-vr.left-offX)/scale),sy=Math.max(0,(r.top-vr.top-offY)/scale),sw=Math.min(v.videoWidth-sx,r.width/scale),sh=Math.min(v.videoHeight-sy,r.height/scale);
  const k=Math.min(1,(shootState.page?1800:960)/sh),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  const cb=shootState.cb;closeShoot();cb(c.toDataURL('image/jpeg',.82));
});
$('#shootCancel').addEventListener('click',closeShoot);
$('#shootLib').addEventListener('click',()=>{const s=shootState;closeShoot();if(s)s.page?pickPhoto(s.cb,false,1800):pickPhoto(async d=>s.cb(await cropCenter(d)),false)});
shootDlg.addEventListener('cancel',closeShoot);

/* ---------- reading the title off the cover (on-device OCR, nothing is uploaded) ---------- */
let ocrWorker=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.append(s)})}
const cleanLine=t=>String(t||'').trim()
  // "被 討厭 的" → "被討厭的", but keep the space between two English words
  .replace(/\s+/g,(m,o,str)=>/[\x21-\x7e]/.test(str[o-1]||'')&&/[\x21-\x7e]/.test(str[o+m.length]||'')?' ':'')
  .replace(/^[\s\p{P}\p{S}]+|[\s\p{P}\p{S}]+$/gu,'');
const AUTHOR_RE=/(著|作者|譯者?|編著|繪|文\/圖|文．圖|原作|原著|written by|by)\s*[:：]?/i;
async function ocrCover(dataUrl,status){
  if(!window.Tesseract){status('第一次使用要下載文字辨識資料（約 10MB），請稍等…');await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')}
  if(!ocrWorker)ocrWorker=Tesseract.createWorker(['chi_tra','jpn','eng'],1,{logger:m=>{if(m.status==='recognizing text')status(`讀取封面上的字… ${Math.round(m.progress*100)}%`)}}).catch(e=>{ocrWorker=null;throw e});
  // a language file that never arrives would otherwise leave the spinner up forever
  const timeout=ms=>new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms));
  const w=await Promise.race([ocrWorker,timeout(120000)]).catch(e=>{ocrWorker=null;throw e});status('讀取封面上的字…');
  const {data}=await Promise.race([w.recognize(dataUrl),timeout(60000)]);
  const lines=(data.lines||[]).map(l=>({text:cleanLine(l.text),h:l.bbox.y1-l.bbox.y0,conf:l.confidence}))
    .filter(l=>l.conf>=35&&(l.text.match(/[\p{L}\p{N}]/gu)||[]).length>=2);
  const seen=new Set();return lines.filter(l=>!seen.has(l.text)&&seen.add(l.text));
}
// Biggest confident line is usually the title; a line with 著／作者 is the author.
function guessFromLines(lines){
  const a=lines.find(l=>AUTHOR_RE.test(l.text)&&!/譯/.test(l.text));
  const t=[...lines].filter(l=>l!==a&&l.conf>=50).sort((x,y)=>y.h-x.h)[0]||lines.find(l=>l!==a);
  return{title:t?.text||'',author:a?a.text.replace(AUTHOR_RE,'').replace(/[\s:：]+$/,'').trim():''};
}
async function readCover(dataUrl){
  if(aiKey()&&await aiFill(dataUrl,'cover'))return;
  const box=$('.ocrbox',form);if(!box)return;const myForm=form.dataset.id+'|'+Date.now();form._ocr=myForm;
  const status=t=>{if(form._ocr===myForm)box.innerHTML=`<div class="ocr-status"><span class="spin"></span>${esc(t)}</div>`};
  status('準備辨識封面…');
  let lines;
  try{lines=await ocrCover(dataUrl,status)}catch(e){if(form._ocr===myForm)box.innerHTML='<div class="hint">沒辦法辨識（可能是網路問題）。可以用「掃描文字」或直接打字。</div>';return}
  if(form._ocr!==myForm||!sheet.open)return;
  if(!lines.length){box.innerHTML='<div class="notfound"><span class="small muted">封面上讀不到字（藝術字、直排的書名常常讀不到）。封面照片已經留下來了，拍一下版權頁，就能讀出書名、作者和 ISBN：</span><button type="button" class="btn sm ghost" data-pageshoot>📄 拍版權頁</button></div>';return}
  form._ocrKind='cover';
  const f=form.elements,g=guessFromLines(lines);
  if(g.title&&!f.title.value)f.title.value=g.title;
  if(g.author&&!f.author.value)f.author.value=g.author;
  form._ocrLines=lines;form._ocrTarget=f.title.value?'author':'title';
  drawOcr();showDup();updateGenreHint();updatePreview();
  if(g.title&&f.q){f.q.value=g.title;searchBooks()}
}
// 版權頁: "書名：…", "作者：…", "出版者：…", "ISBN 978-…"
const PAGE_FIELDS=[['title',/^(?:中文書名|書名)/],['author',/^(?:作者|著者|原著|作繪者|作\/繪者|撰文|文字)/],['translator',/^(?:譯者|翻譯)/],['publisher',/^(?:出版者|出版社|出版|發行所)/]];
const NEXT_LABEL=/\s*(?:譯者|作者|著者|出版者|出版社|發行人|總編輯|主編|責任編輯|封面設計|美術設計|內頁排版|定價|出版日期)\s*[:：].*$/;

  const out={};
  for(const l of lines){const t=l.text;
    for(const[k,re]of PAGE_FIELDS){const m=t.match(re);if(!m||out[k])continue;
      const v=t.slice(m[0].length).replace(/^[\s:：|｜\/]+/,'').replace(NEXT_LABEL,'').replace(/[（(]?(?:著|譯|編著|繪)[)）]?$/,'').trim();
      if(v&&v.length<=60)out[k]=v;break}}
  // no "書名：" label: the title is usually the first / biggest unlabeled line above the author
  if(!out.title){const ai=lines.findIndex(l=>PAGE_FIELDS[1][1].test(l.text));
    const cand=lines.slice(0,ai>0?ai:Math.min(lines.length,4)).filter(l=>!/^[^:：]{1,5}[:：]/.test(l.text)&&!/\d{3,}|ISBN|版權|有限公司|出版/.test(l.text)&&l.text.length>=2);
    const t=cand.sort((x,y)=>y.h-x.h||lines.indexOf(x)-lines.indexOf(y))[0];if(t)out.title=t.text}
  const all=lines.map(l=>l.text).join(' ');
  for(const c of all.match(/97[89][\d\-\s]{10,17}/g)||[]){const d=c.replace(/\D/g,'').slice(0,13);if(validIsbn13(d)){out.isbn=d;break}}
  if(!out.isbn){const m=all.match(/ISBN[^\dX]{0,4}([\d\-\s]{9,13}[\dXx])/i);if(m&&isbn13(m[1]))out.isbn=isbn13(m[1])}

}

// The API key is typed in 設定 and stays in this phone's browser; requests go straight from the phone to Anthropic.
const AI_KEY='my-bookroom-anthropic-key';
const aiKey=()=>{try{return localStorage.getItem(AI_KEY)||''}catch(e){return''}};
let anthropicMod=null;
async function aiClient(){
  if(!anthropicMod)anthropicMod=import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.3.0/+esm').catch(e=>{anthropicMod=null;throw e});
  const m=await anthropicMod,Anthropic=m.default||m.Anthropic;

const BOOK_SCHEMA={type:'object',additionalProperties:false,
  required:['what','title','authors','translators','publisher','isbn','series','volume','genre'],
  properties:{
    what:{type:'string',enum:['cover','copyright_page','spine','back_cover','not_a_book']},
    title:{type:'string'},authors:{type:'array',items:{type:'string'}},translators:{type:'array',items:{type:'string'}},
    publisher:{type:'string'},isbn:{type:'string'},series:{type:'string'},volume:{type:'integer'},
    genre:{type:'string',enum:[...GENRES.map(g=>g.k),OTHER.k]}}};
const AI_SYSTEM=`You read photos of books for a personal library catalogue in Taiwan. The photo is a cover, spine, back cover or copyright page (版權頁/奥付). Books may be in Traditional Chinese, Simplified Chinese, Japanese, English or another language.
Return the bibliographic data:
- title: the main title exactly as printed, in its original language and script (do not translate, do not convert Simplified to Traditional). Include a subtitle after "：" only if it is clearly part of the title. Leave out series names, volume numbers, slogans, award text and blurbs.
- authors / translators: names only, without role words such as 著、作者、譯、訳、文、圖、by. Keep the original script.
- publisher: the publishing house.
- isbn: digits only (13 digits preferred); empty if not visible. Never guess an ISBN.
- series and volume: for manga or numbered series, the series name and the volume number; otherwise "" and 0.
- genre: the best match from the list.

function resizeDataUrl(d,max){
  return loadImg(d).then(img=>{const k=Math.min(1,max/Math.max(img.width,img.height));if(k===1)return d;
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)});
}
async function aiReadBook(dataUrl){
  const {Anthropic,client}=await aiClient();
  const img=await resizeDataUrl(dataUrl,1568);
  try{
    const res=await client.beta.messages.create({
      model:'claude-opus-5-5',max_tokens:4000,
      betas:['server-side-fallback-2026-07-01'],fallbacks:'default',
      output_config:{effort:'low',format:{type:'json_schema',schema:BOOK_SCHEMA}},
      system:AI_SYSTEM,
      messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img.split(',')[1]}},{type:'text',text:'Read this book photo.'}]}],
    });
    if(res.stop_reason==='refusal')throw new Error('AI 拒絕了這張照片');
    const txt=res.content.find(b=>b.type==='text')?.text;
    if(!txt)throw new Error('AI 沒有回傳資料');
    return JSON.parse(txt);
  }catch(e){
    if(e instanceof Anthropic.AuthenticationError)throw new Error('API 金鑰不對，請到「設定」檢查');
    if(e instanceof Anthropic.PermissionDeniedError)throw new Error('這把 API 金鑰沒有權限，請到 Anthropic 後台檢查');
    if(e instanceof Anthropic.RateLimitError)throw new Error('用得太快或額度用完了，等一下再試');
    if(e instanceof Anthropic.APIConnectionError)throw new Error('連不上 AI（檢查一下網路）');
    if(e instanceof Anthropic.APIError)throw new Error(`AI 出錯了（${e.status||'?'}）`);
    throw e;

}

    body=`<h1>開始把書加進來</h1><p class="lead">設定好了！這幾種方法挑順手的用。這一頁之後可以在「設定 → 使用教學」再打開。</p>
    ${how('📷','紙本書：掃條碼',['按書房右上角的 ＋','按搜尋框旁的條碼按鈕，第一次會問相機權限，請按允許','對準書背 <b>978</b> 開頭的條碼，書名、作者、封面會自動帶入','選格式、狀態、放在哪，按儲存'],'scan','現在掃第一本')}
    ${how('📸','拍封面',['查不到的書，按搜尋框旁的相機','把封面對準框框拍，會自動裁成這本書的封面','手機會試著讀出書名和作者，讀錯的話點一下其他文字或直接改','封面讀不到？按「拍版權頁」，拍書最前面或最後面寫著書名、作者、ISBN 的那頁，資料會自動填好','也可以用 iPhone 的「掃描文字」：點書名欄位，對準封面上的書名'],'')}
    ${how('📚','漫畫、套書：一次加一整套',['按 ＋ 後選「一整套」','填系列名稱和集數，例如鬼滅之刃第 1 到 23 集','填已經讀到第幾集，前面的會自動標成讀完','之後買新的一集，在書房的系列卡片按「＋」就好'],'set','加一整套')}
    ${ebooks.length?how('📱',`電子書（${ebooks.join('、')}）：貼上清單`,['用瀏覽器打開電子書網站的書櫃頁面，選取書名複製','回到這裡，按 ＋ 後選「貼上清單」','一行一本，可以寫「書名 / 作者」；不是書名的行先刪掉','選這批是哪個平台，按加入（重複的會自動跳過）'],'bulk','貼上清單'):''}
    ${how('🔍','在書店：我有這本嗎？',['打開書房，在最上面的搜尋框打書名，或按條碼按鈕掃一下','<span style="color:var(--warn)">橘色</span>：你已經有了','<span style="color:var(--accent)">綠色</span>：書房裡沒有，可以放心買'])}
    ${hasOld()&&!db.migrated?how('📦','搬舊資料',[`舊的「旋律日記」書櫃裡有 ${hasOld()} 本書，可以一鍵搬過來`],'migrate','搬過來'):''}
    ${how('💾','記得備份',['資料只存在這支手機的瀏覽器，不會上傳','換手機或清除 Safari 資料前，到「設定 → 匯出備份」'])}`;
    return`<div class="wz">${dots}<div class="body">${body}</div>${foot('開始使用')}</div>`;
  }
  return`<div class="wz">${dots}<div class="body">${body}</div>${foot()}</div>`;
}
function wzAddLoc(v){v=String(v||'').trim();if(!v)return;if(!ui.wz.locs.includes(v))ui.wz.locs.push(v);render();$('#wzLoc')?.focus()}
function finishWelcome(then){
  const w=ui.wz;w.formats.add('paper');
  db.formatsUsed=Object.keys(FORMATS).filter(k=>w.formats.has(k));db.locations=w.locs;db.goal=Math.max(1,+w.goal||12);db.setup=true;save();
  ui.wz=null;ui.tab='shelf';location.hash='shelf';render();window.scrollTo(0,0);
  if(then==='scan'){editBook(null);setTimeout(()=>startScan('sheet'),50)}
  else if(then==='set')openSet();
  else if(then==='bulk')openBulk();
  else if(then==='migrate')migrate();
  else toast('設定完成！');
}
app.addEventListener('click',e=>{
  if(ui.tab!=='welcome')return;
  const t=e.target.closest('button');if(!t)return;const d=t.dataset,w=ui.wz;
  if(d.wz==='next'){w.step++;render();window.scrollTo(0,0)}
  else if(d.wz==='back'){w.step--;render();window.scrollTo(0,0)}
  else if(d.wz==='finish')finishWelcome();
  else if(d.wz==='cancel'){ui.wz=null;go('settings')}
  else if(d.wzgoal){w.goal=+d.wzgoal;render()}
  else if('wzloc'in d)wzAddLoc($('#wzLoc').value);
  else if(d.wzsug)wzAddLoc(d.wzsug);
  else if(d.wzlocdel!==undefined){w.locs.splice(+d.wzlocdel,1);render()}
  else if(d.wzdo)finishWelcome(d.wzdo);
});
app.addEventListener('change',e=>{if(ui.tab==='welcome'&&e.target.dataset.wzfmt){const k=e.target.dataset.wzfmt;e.target.checked?ui.wz.formats.add(k):ui.wz.formats.delete(k)}});
app.addEventListener('input',e=>{if(ui.tab==='welcome'&&e.target.id==='wzGoal'){ui.wz.goal=Math.max(1,+e.target.value||1);$$('[data-wzgoal]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.wzgoal===ui.wz.goal))}});
app.addEventListener('keydown',e=>{if(ui.tab==='welcome'&&e.target.id==='wzLoc'&&e.key==='Enter'){e.preventDefault();wzAddLoc(e.target.value)}});

function toast(msg){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;t.setAttribute('role','status');document.body.append(t);setTimeout(()=>t.remove(),2600)}

Promise.race([loadCovers(),new Promise(r=>setTimeout(r,1500))]).then(()=>{if(!db.setup)startWelcome(true);else{Object.assign(ui,parseHash());render()}});
</script>
</body>
</html>
